name: RaceDay Part 1 Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README exists
        run: test -f README.md

      - name: Check database script exists
        run: test -f RaceDay_Database.sql

      - name: Check ERD exists
        run: test -f RaceDay_ERD.png

      - name: Check API endpoint plan exists
        run: test -f RaceDay_API_Endpoint_Plan.md

      - name: Part 1 validation complete
        run: echo "RaceDay Part 1 files validated successfully."
